# fmsnav em /map/. A porta 80 do EC2 e do Caddy do ~/fortran, que repassa /map*
# para fmsnav:8001 pela rede dele (fortran_default). A raiz fica com o motor.
# 127.0.0.1:8001 so serve para testar de dentro da maquina.
services:
  fmsnav:
    build: .
    image: fmsnav
    restart: unless-stopped
    environment:
      # rpl_back (NOTAMs); vazio = sem desvio de NOTAM
      FMSNAV_RPL_BACK_URL: ${FMSNAV_RPL_BACK_URL:-}
      FMSNAV_DEMO_NOTAMS: ${FMSNAV_DEMO_NOTAMS:-0}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data/build:/data:ro
    networks: [fortran]

networks:
  # criada pelo docker compose do ~/fortran (precisa estar no ar antes)
  fortran:
    name: fortran_default
    external: true
